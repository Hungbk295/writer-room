[package]
name = "writer-room"
version = "2.0.0"
description = "Spy — YouTube channel harvest desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "writer_room_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
